[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "free-logo-marker"
version = "0.1.0"
description = "Local-first AI logo generator and processor"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.50.0",
    "rembg>=2.0.50",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "onnxruntime>=1.16.0",
    "numba>=0.59.0",
    "loguru>=0.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
